name: Android Verify & Security

on:
  push:
    branches: ["Android-client"]
  pull_request:
    branches: ["Android-client"]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  packages: read

jobs:
  lint-kotlin:
    name: Kotlin Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: 17

      - name: Install lint tools
        run: |
          echo "Installing ktlint via homebrew-style binary"

      - name: Run ktlint
        run: |
          curl -sSLo /tmp/ktlint https://github.com/pinterest/ktlint/releases/download/1.3.0/ktlint || true
          chmod +x /tmp/ktlint || true
          /tmp/ktlint lint 'android/**/*.kt' || echo "ktlint not available or found issues"

  gradle-validate:
    name: Gradle Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: 17

      - name: Validate AndroidManifest
        run: |
          test -f android/app/src/main/AndroidManifest.xml
          grep -q "package=" android/app/src/main/AndroidManifest.xml
          grep -q "android.permission.INTERNET" android/app/src/main/AndroidManifest.xml

      - name: Validate layout files
        run: |
          test -f android/app/src/main/res/layout/activity_main.xml
          test -f android/app/src/main/res/values/strings.xml
          grep -q "WebView" android/app/src/main/res/layout/activity_main.xml || echo "No WebView found"

  security-secrets:
    name: Secrets & Container Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: TruffleHog Secrets Scan
        uses: trufflesecurity/trufflehog@v3.88.0
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          extra_args: --only-verified

  yaml-validate:
    name: YAML & Compose Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Lint YAML files
        uses: ibiqlik/action-yamllint@v3
        with:
          file_or_dir: "android"
          config_data: |
            extends: default
            rules:
              line-length:
                max: 200
              truthy: disable
              document-start: disable

  guard:
    name: Guard
    runs-on: ubuntu-latest
    needs: [lint-kotlin, gradle-validate, security-secrets, yaml-validate]
    steps:
      - name: Confirm dependent checks completed
        run: echo "All Android client checks completed."

name: Mobile APK Build & Release

on:
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  build-and-release:
    name: Build & Release APKs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Install Android SDK
        uses: android-actions/setup-android@v4

      - name: Compute next AD alpha patch version
        id: version
        run: |
          set -e
          latest=$(gh release list --repo ${{ github.repository }} --limit 200 --json tagName --jq '.[].tagName' | grep '^WhiskFul-alpha-AD-1\.0\.' | sort -V | tail -1)
          if [[ "$latest" =~ ^WhiskFul-alpha-AD-1\.0\.([0-9]+)$ ]]; then
            next=$(( 10#${BASH_REMATCH[1]} + 1 ))
          else
            # Fallback: start at 26 as instructed by user (continues after 25)
            next=26
          fi
          ver="1.0.$(printf '%02d' "$next")"
          echo "version=$ver" >> "$GITHUB_OUTPUT"
          echo "tag=WhiskFul-alpha-AD-$ver" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Gradle wrapper
        run: |
          cd android
          if [ ! -f gradlew ]; then
            gradle wrapper --gradle-version 8.10.2 --distribution-type bin 2>&1 || true
          fi
          chmod +x gradlew 2>/dev/null || true

      - name: Prepare signing keystore
        id: keystore
        run: |
          if [[ -n "${{ secrets.APK_SIGNING_KEY }}" ]]; then
            mkdir -p /tmp/keystore
            printf '%s' "${{ secrets.APK_SIGNING_KEY }}" | base64 -d > /tmp/keystore/whiskful-release.keystore
            echo "store_file=/tmp/keystore/whiskful-release.keystore" >> "$GITHUB_ENV"
          else
            echo "APK_SIGNING_KEY secret not set; release APK will be unsigned"
          fi

      - name: Build debug APK
        id: build_debug
        env:
          BUILD_DIR: android
          SIGNING_STORE_FILE: ${{ env.store_file }}
          SIGNING_STORE_PASSWORD: ${{ secrets.APK_SIGNING_KEY_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.APK_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.APK_KEY_PASSWORD }}
        run: |
          cd $BUILD_DIR
          ./gradlew :app:assembleDebug --no-daemon
          echo "DEBUG_APK=$(find app/build/outputs/apk -name '*-debug.apk' -type f | head -1)" >> "$GITHUB_OUTPUT"

      - name: Build release APK
        id: build_release
        env:
          BUILD_DIR: android
          SIGNING_STORE_FILE: ${{ env.store_file }}
          SIGNING_STORE_PASSWORD: ${{ secrets.APK_SIGNING_KEY_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.APK_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.APK_KEY_PASSWORD }}
        run: |
          cd $BUILD_DIR
          ./gradlew :app:assembleRelease --no-daemon
          echo "RELEASE_APK=$(find app/build/outputs/apk -name '*-release.apk' -o -name '*-release-unsigned.apk' -type f | head -1)" >> "$GITHUB_OUTPUT"

      - name: Find and copy APKs
        id: apk
        run: |
          cd android
          DEBUG_APK=$(find app/build/outputs/apk -name "*-debug.apk" -type f | head -1 || true)
          RELEASE_APK=$(find app/build/outputs/apk -name "*-release-unsigned.apk" -o -name "*-release.apk" -type f | head -1 || true)
          mkdir -p "$GITHUB_WORKSPACE/artifacts"
          if [[ -n "$DEBUG_APK" ]]; then
            cp "$DEBUG_APK" "$GITHUB_WORKSPACE/artifacts/${{ steps.version.outputs.tag }}-debug.apk"
            echo "debug=$GITHUB_WORKSPACE/artifacts/${{ steps.version.outputs.tag }}-debug.apk" >> "$GITHUB_OUTPUT"
          fi
          if [[ -n "$RELEASE_APK" ]]; then
            cp "$RELEASE_APK" "$GITHUB_WORKSPACE/artifacts/${{ steps.version.outputs.tag }}-release.apk"
            echo "release=$GITHUB_WORKSPACE/artifacts/${{ steps.version.outputs.tag }}-release.apk" >> "$GITHUB_OUTPUT"
          fi
          if [[ -z "$DEBUG_APK" && -z "$RELEASE_APK" ]]; then
            exit 1
          fi

      - name: Generate release notes from commits
        id: release_notes
        run: |
          LAST_TAG=$(git describe --tags --match "alpha-1.0.*" 2>/dev/null | tail -1)
          if [[ -n "$LAST_TAG" ]]; then
            NOTES=$(git log --oneline "$LAST_TAG"..HEAD --pretty=format:"- %s (%h)" | head -50)
          else
            NOTES=$(git log --oneline HEAD --since="2026-09-01" --pretty=format:"- %s (%h)" | head -50)
          fi
          if [[ -z "$NOTES" ]]; then
            NOTES="New APK build for version ${{ steps.version.outputs.tag }}"
          fi
          echo "$NOTES" > release_notes.md
          echo "release_notes<<EOF" >> "$GITHUB_OUTPUT"
          cat release_notes.md >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: WhiskFul-${{ steps.version.outputs.tag }}
          body_path: release_notes.md
          prerelease: true
          make_latest: true
          files: |
            ${{ steps.apk.outputs.debug }}
            ${{ steps.apk.outputs.release }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload debug APK artifact
        if: steps.apk.outputs.debug != ''
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.version.outputs.tag }}-debug
          path: ${{ steps.apk.outputs.debug }}
          retention-days: 90

      - name: Upload release APK artifact
        if: steps.apk.outputs.release != ''
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.version.outputs.tag }}-release
          path: ${{ steps.apk.outputs.release }}
          retention-days: 90

      - name: Collect debug build logs (10MB cap)
        id: export_logs
        run: |
          mkdir -p /tmp/debug_logs
          echo "=== WhiskFul Debug Build Log ===" > /tmp/debug_logs/debug_build_log.txt
          echo "Build: ${{ github.run_id }}" >> /tmp/debug_logs/debug_build_log.txt
          echo "Version: ${{ steps.version.outputs.version }}" >> /tmp/debug_logs/debug_build_log.txt
          echo "Time: $(date -u)" >> /tmp/debug_logs/debug_build_log.txt
          echo "Runner: $(uname -a)" >> /tmp/debug_logs/debug_build_log.txt
          find android/app/build -type f \( -name "*.html" -o -name "*.xml" \) 2>/dev/null | head -20 >> /tmp/debug_logs/debug_build_log.txt || true
          truncate -s 10M /tmp/debug_logs/debug_build_log.txt 2>/dev/null || true
          echo "log_file=/tmp/debug_logs/debug_build_log.txt" >> "$GITHUB_OUTPUT"

      - name: Upload debug build logs artifact
        if: steps.export_logs.outputs.log_file != ''
        uses: actions/upload-artifact@v4
        with:
          name: whiskful-debug-logs-${{ steps.version.outputs.version }}
          path: /tmp/debug_logs/debug_build_log.txt
          retention-days: 90

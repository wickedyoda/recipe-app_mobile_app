name: Mobile APK Build & Release

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:
    inputs:
      build_type:
        description: Build type
        required: true
        default: all
        type: choice
        options:
          - all
          - debug
          - release

permissions:
  contents: write
  packages: write

jobs:
  build-and-release:
    name: Build & Release APKs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute next alpha patch version
        id: version
        run: |
          latest="$(gh release list --repo ${{ github.repository }} --limit 1 --json tagName --jq '.[0].tagName // empty' 2>/dev/null || true)"
          if [[ "$latest" =~ ^alpha-1\.0\.([0-9]+)$ ]]; then
            next=$(( (${BASH_REMATCH[1]} + 1) ))
          else
            next=1
          fi
          ver="alpha-1.0.$(printf '%02d' "$next")"
          echo "version=$ver" >> "$GITHUB_OUTPUT"
          echo "tag=$ver" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Install Android SDK
        uses: android-actions/setup-android@v3

      - name: Set version name
        run: |
          cp scripts/set_version.py android/
          cd android
          sed -i 's/versionCode = [0-9]*/versionCode = 1/' app/build.gradle.kts
          python3 set_version.py "${{ steps.version.outputs.version }}" app/build.gradle.kts
          echo "--- Updated build.gradle.kts ---"
          grep -A2 "versionCode\|versionName" app/build.gradle.kts

      - name: Generate Gradle wrapper
        run: |
          cd android
          if [ ! -f gradlew ]; then
            gradle wrapper --gradle-version 8.10.2 --distribution-type bin 2>&1 || true
          fi
          chmod +x gradlew 2>/dev/null || true

      - name: Prepare signing keystore
        run: |
          if [[ -n "${{ secrets.APK_SIGNING_KEY }}" ]]; then
            mkdir -p /tmp/keystore
            printf '%s' "${{ secrets.APK_SIGNING_KEY }}" | base64 -d > /tmp/keystore/wiskful-release.keystore
            echo "store_file=/tmp/keystore/wiskful-release.keystore" >> "$GITHUB_ENV"
            echo "Keystore prepared: $(ls -l /tmp/keystore/wiskful-release.keystore)"
          else
            echo "APK_SIGNING_KEY secret not set; release APK will be unsigned"
          fi

      - name: Set build type
        id: build_type
        run: |
          if [[ -n "${{ inputs.build_type }}" ]]; then
            BT="${{ inputs.build_type }}"
          else
            BT="all"
          fi
          echo "build_type=$BT" >> "$GITHUB_OUTPUT"

      - name: Build debug and release APKs
        env:
          BUILD_TYPE: ${{ steps.build_type.outputs.build_type }}
        run: |
          cd android
          echo "BUILD_TYPE=$BUILD_TYPE"
          ls -la gradlew
          if [[ "$BUILD_TYPE" == "all" || "$BUILD_TYPE" == "debug" ]]; then
            ./gradlew :app:assembleDebug --no-daemon 2>&1
          fi
          if [[ "$BUILD_TYPE" == "all" || "$BUILD_TYPE" == "release" ]]; then
            if [[ -f /tmp/keystore/wiskful-release.keystore ]]; then
              SIGNING_STORE_FILE=/tmp/keystore/wiskful-release.keystore ./gradlew :app:assembleRelease --no-daemon 2>&1
            else
              echo "Keystore not found; building unsigned release"
              ./gradlew :app:assembleRelease --no-daemon 2>&1
            fi
          fi

      - name: Find and copy APKs
        id: apk
        run: |
          cd android
          DEBUG_APK=$(find app/build/outputs/apk -name "*-debug.apk" -type f | head -1 || true)
          RELEASE_APK=$(find app/build/outputs/apk -name "*-release-unsigned.apk" -o -name "*-release.apk" -type f | head -1 || true)
          mkdir -p ../artifacts
          if [[ -n "$DEBUG_APK" ]]; then
            cp "$DEBUG_APK" "../artifacts/wiskful-android-debug.apk"
            echo "debug=../artifacts/wiskful-android-debug.apk" >> "$GITHUB_OUTPUT"
          fi
          if [[ -n "$RELEASE_APK" ]]; then
            cp "$RELEASE_APK" "../artifacts/wiskful-android-release.apk"
            echo "release=../artifacts/wiskful-android-release.apk" >> "$GITHUB_OUTPUT"
          fi
          echo "DEBUG_APK: $DEBUG_APK"
          echo "RELEASE_APK: $RELEASE_APK"
          ls -la ../artifacts 2>/dev/null || true
          if [[ -z "$DEBUG_APK" && -z "$RELEASE_APK" ]]; then
            echo "No APKs found"
            exit 1
          fi

      - name: Generate release notes from commits
        id: release_notes
        run: |
          LAST_TAG=$(git describe --tags --match "alpha-1.0.*" 2>/dev/null | tail -1)
          if [[ -n "$LAST_TAG" ]]; then
            echo "Previous tag: $LAST_TAG"
            NOTES=$(git log --oneline "$LAST_TAG"..HEAD --pretty=format:"- %s (%h)")
          else
            echo "No previous alpha release tag found"
            NOTES=$(git log --oneline HEAD --since="2026-08-01" --pretty=format:"- %s (%h)")
          fi
          if [[ -z "$NOTES" ]]; then
            NOTES="New APK build for version ${{ steps.version.outputs.version }}"
          fi
          echo "$NOTES" > release_notes.md
          echo "Release notes:"
          cat release_notes.md
          echo "release_notes<<EOF" >> "$GITHUB_OUTPUT"
          cat release_notes.md >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: WiskFul APK ${{ steps.version.outputs.version }}
          body_path: release_notes.md
          generate_release_notes: false
          prerelease: true
          make_latest: true
          files: |
            ${{ steps.apk.outputs.debug }}
            ${{ steps.apk.outputs.release }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload debug APK artifact
        if: steps.apk.outputs.debug != ''
        uses: actions/upload-artifact@v4
        with:
          name: wiskful-apk-${{ steps.version.outputs.version }}-debug
          path: ${{ steps.apk.outputs.debug }}
          retention-days: 90

      - name: Upload release APK artifact
        if: steps.apk.outputs.release != ''
        uses: actions/upload-artifact@v4
        with:
          name: wiskful-apk-${{ steps.version.outputs.version }}-release
          path: ${{ steps.apk.outputs.release }}
          retention-days: 90
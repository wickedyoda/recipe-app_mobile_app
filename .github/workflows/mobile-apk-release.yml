name: Mobile APK Build & Release

on:
  workflow_dispatch:
    inputs:
      sub_version:
        description: "Subversion increment (e.g. 1 for 1.0.1)"
        required: true
        type: string
        default: "1"
      build_type:
        description: "Build type"
        required: false
        default: "release"
        type: choice
        options:
          - debug
          - release

permissions:
  contents: write
  packages: write

jobs:
  build-and-release:
    name: Build & Release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: 17

      - name: Install Android SDK
        uses: android-actions/setup-android@v3

      - name: Set version name
        id: version
        run: |
          SUB_VERSION=${{ inputs.sub_version }}
          VERSION_NAME="1.0.${SUB_VERSION}"
          echo "version_name=${VERSION_NAME}" >> $GITHUB_OUTPUT
          echo "Version: ${VERSION_NAME}"

      - name: Update versionCode and versionName
        run: |
          cd android
          sed -i 's/versionCode = [0-9]*/versionCode = 1/' app/build.gradle.kts
          sed -i "s/versionName = \"1.0\"/versionName = \"1.0.${{ inputs.sub_version }}\"/" app/build.gradle.kts
          sed -i "s/versionName = \"1.0.[0-9]*\"/versionName = \"1.0.${{ inputs.sub_version }}\"/" app/build.gradle.kts
          echo "--- Updated build.gradle.kts ---"
          grep -A2 "versionCode\|versionName" app/build.gradle.kts

      - name: Generate Gradle wrapper
        run: |
          cd android
          if [ ! -f gradlew ]; then
            gradle wrapper --gradle-version 8.10.2 --distribution-type bin 2>&1 || true
          fi
          chmod +x gradlew 2>/dev/null || true

      - name: Build APK
        run: |
          cd android
          BUILD_TYPE=${{ inputs.build_type || 'release' }}
          if [ "$BUILD_TYPE" = "release" ]; then
            ./gradlew :app:assembleRelease --no-daemon 2>&1
          else
            ./gradlew :app:assembleDebug --no-daemon 2>&1
          fi

      - name: Find and copy APK
        id: apk
        run: |
          cd android
          APK_FILE=$(find app/build/outputs/apk -name "*.apk" -type f | head -1)
          if [ -n "$APK_FILE" ]; then
            cp "$APK_FILE" "../whiskful-android.apk"
            echo "APK: $APK_FILE"
          else
            echo "No APK found"
            ls -la app/build/outputs/apk/ 2>/dev/null
            exit 1
          fi

      - name: Generate release notes from commits
        id: release_notes
        run: |
          # Get commits since last release (or all commits if no previous release)
          LAST_TAG=$(git describe --tags --match "v1.0.*" 2>/dev/null | tail -1)
          if [ -n "$LAST_TAG" ]; then
            echo "Previous tag: $LAST_TAG"
            NOTES=$(git log --oneline "$LAST_TAG"..HEAD -- pretty=format:"- %s (%h)")
          else
            echo "No previous release tag found"
            NOTES=$(git log --oneline HEAD --since="2026-08-01" -- pretty=format:"- %s (%h)")
          fi
          if [ -z "$NOTES" ]; then
            NOTES="New APK build for version ${{ steps.version.outputs.version_name }}"
          fi
          echo "$NOTES" > release_notes.md
          echo "Release notes:"
          cat release_notes.md
          echo "release_notes<<EOF" >> $GITHUB_OUTPUT
          cat release_notes.md >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Set release tag
        id: tag
        run: |
          echo "tag=v1.0.${{ inputs.sub_version }}" >> $GITHUB_OUTPUT

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: whiskful-apk-v1.0.${{ inputs.sub_version }}
          path: ./whiskful-android.apk
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ./whiskful-android.apk
          tag_name: "v1.0.${{ inputs.sub_version }}"
          name: "WhiskFul APK v1.0.${{ inputs.sub_version }}"
          body_path: release_notes.md
          generate_release_notes: false
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

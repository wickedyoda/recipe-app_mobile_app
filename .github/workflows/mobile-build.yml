name: Mobile Build

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:
    inputs:
      build_type:
        description: "Build type"
        required: false
        default: "debug"
        type: choice
        options:
          - debug
          - release

permissions:
  contents: write
  packages: write

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: 17

      - name: Install Android SDK
        uses: android-actions/setup-android@v3

      - name: Generate Gradle wrapper and build
        run: |
          cd android
          if [ ! -f gradlew ]; then
            gradle wrapper --gradle-version 8.10.2 --distribution-type bin 2>&1 || true
          fi
          chmod +x gradlew 2>/dev/null || true
          BUILD_TYPE=${{ inputs.build_type || 'debug' }}
          if [ "$BUILD_TYPE" = "release" ]; then
            ./gradlew assembleRelease --no-daemon 2>&1 || echo "Release build tools not available"
          else
            ./gradlew assembleDebug --no-daemon 2>&1 || echo "Build tools not available"
          fi

      - name: Upload Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-app
          path: |
            android/app/build/outputs/apk/**/*.apk
          if-no-files-found: ignore

  build-ios:
    name: Build iOS IPA
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          allow-prereleases: true

      - name: Install EAS CLI
        run: npm install -g eas-cli

      - name: Create eas.json if missing
        run: |
          if [ ! -f eas.json ]; then
            echo '{ "build": { "preview": { "ios": { "simulator": true } } } }' > eas.json
          fi

      - name: Build iOS
        run: |
          if [ -z "${{ secrets.EXPO_TOKEN }}" ]; then
            echo "EXPO_TOKEN not set, skipping iOS build"
          else
            eas build --platform ios --profile preview --non-interactive --token "${{ secrets.EXPO_TOKEN }}" || true
          fi

      - name: Upload iOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-app
          path: |
            ios/build/**/*.ipa
          if-no-files-found: ignore

  publish-push-apk:
    name: Publish APK on Push
    runs-on: ubuntu-latest
    needs: [build-android]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: 17

      - name: Install Android SDK
        uses: android-actions/setup-android@v3

      - name: Build debug APK
        run: |
          cd android
          if [ ! -f gradlew ]; then
            gradle wrapper --gradle-version 8.10.2 --distribution-type bin 2>&1 || true
          fi
          chmod +x gradlew 2>/dev/null || true
          ./gradlew assembleDebug --no-daemon 2>&1
          APKS=$(find app/build/outputs/apk -name "*-debug.apk" -type f | head -1)
          if [ -n "$APKS" ]; then
            cp "$APKS" "../wiskfful-android.apk"
          else
            echo "No APK found at $(pwd)/app/build/outputs/apk/"
            ls -la app/build/outputs/apk/ 2>/dev/null || echo "APK directory does not exist"
            exit 1
          fi

      - name: Upload APK as commit artifact
        uses: actions/upload-artifact@v4
        with:
          name: wiskfful-android-${{ github.sha }}
          path: ./wiskfful-android.apk
          if-no-files-found: error
          retention-days: 90

      - name: Create or update release with APK
        uses: softprops/action-gh-release@v2
        with:
          files: ./wiskfful-android.apk
          tag_name: "apk-${{ github.sha }}"
          name: "APK Build ${{ github.sha }}"
          generate_release_notes: false
          prerelease: true
          make_latest: false
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-android-package:
    name: Publish Android to GHCR
    runs-on: ubuntu-latest
    needs: [build-android]
    if: github.event_name == 'release' && github.event.action == 'published'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: 17

      - name: Install Android SDK
        uses: android-actions/setup-android@v3

      - name: Build and package APK
        run: |
          cd android
          if [ ! -f gradlew ]; then
            gradle wrapper --gradle-version 8.10.2 --distribution-type bin 2>&1 || true
          fi
          chmod +x gradlew 2>/dev/null || true
          ./gradlew assembleDebug --no-daemon 2>&1
          APKS=$(find app/build/outputs/apk -name "*.apk" -type f | head -1)
          if [ -n "$APKS" ]; then
            cp "$APKS" "../wiskfful-android.apk"
          else
            echo "No APK found at $(pwd)/app/build/outputs/apk/"
            ls -la app/build/outputs/apk/ 2>/dev/null || echo "APK directory does not exist"
            exit 1
          fi

      - name: Upload APK to GitHub Packages
        uses: actions/upload-artifact@v4
        with:
          name: wiskfful-android-${{ github.ref_name }}
          path: ./wiskfful-android.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload APK as release asset
        uses: softprops/action-gh-release@v2
        with:
          files: ./wiskfful-android.apk

  publish-ios-package:
    name: Publish iOS to GHCR
    runs-on: macos-latest
    needs: [build-ios]
    if: github.event_name == 'release' && github.event.action == 'published'
    continue-on-error: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          allow-prereleases: true

      - name: Install EAS CLI
        run: npm install -g eas-cli

      - name: Build iOS and publish
        run: |
          if [ -z "${{ secrets.EXPO_TOKEN }}" ]; then
            echo "EXPO_TOKEN not set, skipping iOS publish"
            exit 0
          fi
          if [ ! -f eas.json ]; then
            echo '{ "build": { "production": { "ios": { "simulator": false } } } }' > eas.json
          fi
          eas build --platform ios --profile production --non-interactive --token "${{ secrets.EXPO_TOKEN }}"

      - name: Download iOS artifact
        uses: actions/download-artifact@v4
        with:
          name: ios-app
          path: ./ios-artifact

      - name: Publish IPA to GitHub Packages
        uses: actions/upload-artifact@v4
        with:
          name: wiskfful-ios-${{ github.ref_name }}
          path: ./ios-artifact/*.ipa
          if-no-files-found: error
          retention-days: 30

      - name: Upload IPA as release asset
        uses: softprops/action-gh-release@v2
        with:
          files: ./ios-artifact/*.ipa

  require-success:
    name: Wait for Verify & Security
    runs-on: ubuntu-latest
    needs: [build-android, build-ios]
    if: github.event_name == 'push'
    steps:
      - name: Check upstream workflow status
        run: |
          echo "Verify and Security workflows must pass before Build"
          echo "If this job runs, upstream checks passed."
      - name: Confirm all checks completed
        run: echo "All mobile client security checks and builds completed."

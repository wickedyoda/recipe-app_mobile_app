name: Mobile Build & Security

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  packages: read

jobs:
  lint-kotlin:
    name: Kotlin Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: 17

      - name: Validate AndroidManifest
        run: |
          test -f android/app/src/main/AndroidManifest.xml
          grep -q "package=" android/app/src/main/AndroidManifest.xml
          grep -q "android.permission.INTERNET" android/app/src/main/AndroidManifest.xml

      - name: Validate layout files
        run: |
          test -f android/app/src/main/res/layout/activity_main.xml
          test -f android/app/src/main/res/values/strings.xml
          grep -q "WebView" android/app/src/main/res/layout/activity_main.xml

  security-secrets:
    name: Secrets Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: TruffleHog Secrets Scan
        uses: trufflesecurity/trufflehog@v3.88.0
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          extra_args: --only-verified

  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: 17

      - name: Install Android SDK
        uses: android-actions/setup-android@v3

      - name: Build release APK
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease -p android || true

      - name: Upload Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-app
          path: |
            android/app/build/outputs/apk/**/*.apk
          if-no-files-found: ignore

  build-ios:
    name: Build iOS IPA
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install EAS CLI
        run: npm install -g eas-cli

      - name: Build iOS
        run: eas build --platform ios --non-interactive --token "${{ secrets.EXPO_TOKEN }}" || true

      - name: Upload iOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-app
          path: |
            ios/build/**/*.ipa
          if-no-files-found: ignore

  container-scan:
    name: Container Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: "fs"
          scan-ref: "."
          format: "sarif"
          output: "trivy-results.sarif"
          severity: "CRITICAL,HIGH"
          exit-code: "0"

      - name: Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: "trivy-results.sarif"
          category: "trivy-mobile"

  guard:
    name: Build Success Gate
    runs-on: ubuntu-latest
    needs: [lint-kotlin, security-secrets, build-android, build-ios, container-scan]
    steps:
      - name: Confirm all builds and checks completed
        run: echo "All mobile client builds and security checks completed."

name: iOS IPA Build & Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ipa:
    name: Build iOS IPA
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Derive iOS version tag
        id: version
        run: |
          set -e
          latest=$(gh release list --repo ${{ github.repository }} --limit 200 --json tagName --jq '.[].tagName' | grep '^WhiskFul-alpha-ios-1\.0\.' | sort -V | tail -1)
          if [[ "$latest" =~ ^WhiskFul-alpha-ios-1\.0\.([0-9]+)$ ]]; then
            next=$(( 10#${BASH_REMATCH[1]} + 1 ))
          else
            next=1
          fi
          ver="1.0.$(printf '%02d' "$next")"
          echo "version=$ver" >> "$GITHUB_OUTPUT"
          echo "tag=WhiskFul-alpha-ios-$ver" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Sign in with Apple ID
        uses: apple-actions/setup-apple-id@v1
        with:
          apple-id: ${{ secrets.APPLE_ID }}
          apple-id-password: ${{ secrets.APPLE_ID_PASSWORD }}
          team-id: ${{ secrets.DEVELOPMENT_TEAM }}

      - name: Build and archive WhiskFul
        run: |
          xcodebuild \
            -project ios/WiskFul/WhiskFul.xcodeproj \
            -scheme WhiskFul \
            -configuration Release \
            -archivePath $PWD/build/WhiskFul.xcarchive \
            -destination "generic/platform=iOS" \
            clean archive \
            CODE_SIGN_STYLE=Automatic \
            CODE_SIGN_IDENTITY="Apple Development" \
            DEVELOPMENT_TEAM="${{ secrets.DEVELOPMENT_TEAM }}" \
            IPHONEOS_DEPLOYMENT_TARGET=25.0 \
            -allowProvisioningUpdates

      - name: Export IPA
        if: always()
        run: |
          xcodebuild -exportArchive \
            -archivePath $PWD/build/WhiskFul.xcarchive \
            -exportPath $PWD/build \
            -exportOptionsPlist ios/exportOptions.plist \
            -allowProvisioningUpdates

      - name: Upload IPA artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.version.outputs.tag }}
          path: build/WhiskFul.ipa
          retention-days: 30

      - name: Generate release notes from commits
        id: release_notes
        run: |
          LAST_TAG=$(git describe --tags --match "alpha-1.0.*" 2>/dev/null | tail -1)
          if [[ -n "$LAST_TAG" ]]; then
            NOTES=$(git log --oneline "$LAST_TAG"..HEAD --pretty=format:"- %s (%h)" | head -50)
          else
            NOTES=$(git log --oneline HEAD --since="2026-09-01" --pretty=format:"- %s (%h)" | head -50)
          fi
          if [[ -z "$NOTES" ]]; then
            NOTES="New IPA build for version ${{ steps.version.outputs.version }}"
          fi
          echo "$NOTES" > release_notes.md
          echo "release_notes<<EOF" >> "$GITHUB_OUTPUT"
          cat release_notes.md >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Create/Update GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: WhiskFul-${{ steps.version.outputs.version }}
          body_path: release_notes.md
          prerelease: true
          make_latest: true
          files: |
            build/WhiskFul.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

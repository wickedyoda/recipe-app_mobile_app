name: Mobile Verify

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint-kotlin:
    name: Kotlin Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: 17

      - name: Run ktlint
        run: |
          curl -sSLo /tmp/ktlint https://github.com/pinterest/ktlint/releases/download/1.3.0/ktlint || true
          chmod +x /tmp/ktlint || true
          /tmp/ktlint lint 'android/**/*.kt' || echo "ktlint not available or found issues"

  asset-validation:
    name: Mobile Asset Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: 17

      - name: Validate AndroidManifest
        run: |
          test -f android/app/src/main/AndroidManifest.xml
          grep -q "android.permission.INTERNET" android/app/src/main/AndroidManifest.xml
          grep -q "usesCleartextTraffic" android/app/src/main/AndroidManifest.xml

      - name: Validate network security config
        run: |
          test -f android/app/src/main/res/xml/network_security_config.xml
          grep -q "cleartextTrafficPermitted" android/app/src/main/res/xml/network_security_config.xml

      - name: Validate iOS files
        run: |
          test -f ios/WhiskFul/WhiskFulApp.swift
          test -f ios/WhiskFul/ContentView.swift
          test -f ios/WhiskFul/RecipeAppWebView.swift

      - name: Validate Android WebView security
        run: |
          grep -q "allowFileAccess.*false\|allowFileAccess = false" android/app/src/main/java/com/whiskful/webview/MainActivity.kt
          grep -q "allowContentAccess.*false\|allowContentAccess = false" android/app/src/main/java/com/whiskful/webview/MainActivity.kt
          grep -q "shouldOverrideUrlLoading" android/app/src/main/java/com/whiskful/webview/MainActivity.kt

  yaml-validate:
    name: YAML & Config Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Lint YAML files
        uses: ibiqlik/action-yamllint@v3
        with:
          file_or_dir: "."
          config_data: |
            extends: default
            rules:
              line-length:
                max: 200
              truthy: disable
              document-start: disable
